services:
  strategy-demo:
    build: .
    image: cryptoea:latest
    command: ["python", "scripts/deploy_sol_momentum.py", "--mode", "demo"]
    env_file:
      - .env
    environment:
      CRYPTOEA_MODE: demo
    volumes:
      - ./runtime:/app/runtime
      - ./research:/app/research:ro
    restart: unless-stopped

  shadow-backtest-demo:
    image: cryptoea:latest
    build: .
    command: ["python", "scripts/shadow_backtest_demo.py"]
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      - ./research:/app/research:ro
    restart: unless-stopped
    depends_on:
      - strategy-demo

  replay-proxy:
    image: cryptoea:latest
    build: .
    profiles: ["test"]
    command: ["python", "scripts/replay_deployment_proxy.py", "--source", "binance", "--fail-on-mismatch"]
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      - ./research:/app/research:ro
      - ./data:/app/data:ro
    restart: "no"

  live-path-validation-replay:
    image: cryptoea:latest
    build: .
    profiles: ["test"]
    command:
      [
        "python",
        "scripts/replay_deployment_proxy.py",
        "--source",
        "local",
        "--data-start",
        "2020-01-01",
        "--data-end",
        "2025-06-01",
        "--eval-start",
        "2024-01-01",
        "--eval-end",
        "2025-06-01",
        "--engine",
        "both",
        "--output-dir",
        "runtime/replay_proxy_validation_live",
        "--fail-on-mismatch",
      ]
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      - ./research:/app/research:ro
      - ./data:/app/data:ro
    restart: "no"

  strategy-live:
    image: cryptoea:latest
    build: .
    profiles: ["live"]
    command: ["python", "scripts/deploy_sol_momentum.py", "--mode", "live", "--exchange", "mainnet"]
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      - ./research:/app/research:ro
    restart: "no"

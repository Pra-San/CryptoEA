<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoEA Backtest Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f3;
      --surface: #ffffff;
      --surface-2: #eef2ef;
      --line: #d7ddd8;
      --ink: #182026;
      --muted: #5e6b73;
      --teal: #0f766e;
      --blue: #2563eb;
      --amber: #b45309;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
    }
    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    main {
      display: grid;
      grid-template-columns: minmax(460px, 1fr) minmax(360px, 520px);
      gap: 18px;
      padding: 18px;
    }
    section {
      min-width: 0;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    input, select {
      height: 36px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    input { min-width: 220px; flex: 1; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 13px;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 73px;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 700;
      z-index: 2;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3) {
      text-align: left;
    }
    tr {
      cursor: pointer;
    }
    tr:hover td {
      background: #f9faf7;
    }
    tr.selected td {
      background: #e8f3f1;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 16px;
      min-height: 260px;
    }
    .panel h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .subtle {
      color: var(--muted);
      font-size: 13px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .metric {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 76px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .metric .value {
      font-size: 18px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }
    .positive { color: var(--teal); }
    .warning { color: var(--amber); }
    .negative { color: var(--red); }
    .bars {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }
    .barrow {
      display: grid;
      grid-template-columns: 126px 1fr 72px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .track {
      height: 10px;
      background: #e3e8e3;
      overflow: hidden;
      border-radius: 999px;
    }
    .fill {
      height: 100%;
      background: var(--blue);
      width: 0;
    }
    dl {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px 12px;
      margin: 16px 0 0;
      font-size: 13px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty {
      background: var(--surface);
      border: 1px dashed var(--line);
      padding: 24px;
      color: var(--muted);
    }
    @media (max-width: 980px) {
      header { align-items: flex-start; flex-direction: column; }
      .topline { white-space: normal; }
      main { grid-template-columns: 1fr; padding: 12px; }
      th { top: 0; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      table { font-size: 12px; }
      th, td { padding: 8px 7px; }
      .metrics { grid-template-columns: 1fr; }
      .barrow { grid-template-columns: 104px 1fr 58px; }
      dl { grid-template-columns: 1fr; }
    }
  </style>

    function fillOptions(id, values) {
      const select = filters[id];
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);

          && (!filters.version.value || run.strategy_version === filters.version.value);

          <dt>Run ID</dt><dd>${escapeHtml(run.run_id)}</dd>
          <dt>Git SHA</dt><dd>${escapeHtml(run.git_sha || '')}</dd>
          <dt>Bars</dt><dd>${num(run.data?.bars)}</dd>
          <dt>Expectancy</dt><dd>${num(metric(run, 'expectancy'))}</dd>
          <dt>Avg Trade Return</dt><dd>${pct(metric(run, 'avg_trade_return') * 100)}</dd>
          <dt>Worst Trade</dt><dd>${num(metric(run, 'worst_trade'))}</dd>
          <dt>Best Month</dt><dd>${pct(metric(run, 'best_month') * 100)}</dd>
          <dt>Worst Month</dt><dd>${pct(metric(run, 'worst_month') * 100)}</dd>
          <dt>Report</dt><dd>${artifacts.report_txt ? `<a href="${escapeAttr(artifacts.report_txt)}">report.txt</a>` : ''}</dd>
          <dt>Trades</dt><dd>${artifacts.trades_csv ? `<a href="${escapeAttr(artifacts.trades_csv)}">trades.csv</a>` : ''}</dd>
          <dt>Equity</dt><dd>${artifacts.equity_csv ? `<a href="${escapeAttr(artifacts.equity_csv)}">equity.csv</a>` : ''}</dd>
        </dl>`;
    }

    function metricTile(label, value, klass) {
      return `<div class="metric"><div class="label">${escapeHtml(label)}</div><div class="value ${klass}">${escapeHtml(value)}</div></div>`;
    }

    function bar(label, value, max, shown, color) {
      const width = Math.max(0, Math.min(100, Number(value || 0) / max * 100));
      return `<div class="barrow"><div>${escapeHtml(label)}</div><div class="track"><div class="fill" style="width:${width}%;background:${color}"></div></div><div>${escapeHtml(shown)}</div></div>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    render();
  </script>
</body>
</html>
